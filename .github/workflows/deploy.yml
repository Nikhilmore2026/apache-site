name: Apache Site Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop existing container (if running)
        run: |
          docker stop apache-container || true
          docker rm apache-container || true

      - name: Build Docker Image
        run: |
          docker build -t apache-site .

      - name: Run Container
        run: |
          docker run -d -p 8082:80 --name apache-container apache-site
